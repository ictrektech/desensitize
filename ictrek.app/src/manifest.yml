id: com.ictrek.desensitize
name:
  zh-CN: 数据脱敏服务
  en: Desensitize Service
description:
  zh-CN: 文本与图片敏感信息脱敏服务，支持正则规则、NER 和 OCR；模型管理与推理授权由 V-Scheduler 统一提供。
  en: Text and image redaction with regex rules, NER and OCR, using V-Scheduler for model management and inference authorization.
version: __APP_VERSION__
author: ictrek
category: [ai]
arch: [amd64, arm64]

frontend:
  enabled: true
  basePath: /app/com.ictrek.desensitize

platform:
  version: ">=3.0.0"

dependencies:
  apps:
    - id: com.ictrek.v-scheduler
      version: latest
      optional: false

profiles:
  - name: amd
    title:
      zh-CN: AMD64 CUDA
      en: AMD64 CUDA
    description:
      zh-CN: AMD64 平台，声明 nvidia runtime，通过 V-Scheduler 授权运行 ONNX NER/OCR 模型。
      en: AMD64 platform with nvidia runtime, runs ONNX NER/OCR models with V-Scheduler authorization.
    caps:
      arch: amd64
      software: [cuda]
    conflicts: [amd-without-cuda, arm, arm-without-cuda, l4t, thor-spark]
  - name: amd-without-cuda
    title:
      zh-CN: AMD64 无 CUDA
      en: AMD64 without CUDA
    description:
      zh-CN: AMD64 平台，不声明 nvidia runtime，适用于无显卡或未配置 NVIDIA runtime 的主机。
      en: AMD64 platform without nvidia runtime, for hosts without GPUs or NVIDIA runtime.
    caps:
      arch: amd64
    conflicts: [amd, arm, arm-without-cuda, l4t, thor-spark]
  - name: arm
    title:
      zh-CN: ARM CUDA
      en: ARM CUDA
    description:
      zh-CN: ARM64 平台，声明 nvidia runtime，通过 V-Scheduler 授权运行 ONNX NER/OCR 模型。
      en: ARM64 platform with nvidia runtime, runs ONNX NER/OCR models with V-Scheduler authorization.
    caps:
      device-type: generic
      arch: arm64
      software: [cuda]
    conflicts: [amd, amd-without-cuda, arm-without-cuda, l4t, thor-spark]
  - name: arm-without-cuda
    title:
      zh-CN: ARM 无 CUDA
      en: ARM without CUDA
    description:
      zh-CN: ARM64 平台，不声明 nvidia runtime，适用于无显卡 ARM 主机。
      en: ARM64 platform without nvidia runtime, for ARM hosts without GPUs.
    caps:
      arch: arm64
    conflicts: [amd, amd-without-cuda, arm, l4t, thor-spark]
  - name: l4t
    title:
      zh-CN: Jetson / L4T
      en: Jetson / L4T
    description:
      zh-CN: Jetson / L4T 平台（如 tc192），通过 V-Scheduler 授权运行 ONNX NER/OCR 模型。
      en: Jetson / L4T platform (e.g. tc192), runs ONNX NER/OCR models with V-Scheduler authorization.
    caps:
      device-type:
        - any-of: [l4t, jetson]
      arch: arm64
      software: [cuda]
    conflicts: [amd, amd-without-cuda, arm, arm-without-cuda, thor-spark]
  - name: thor-spark
    title:
      zh-CN: Thor Spark
      en: Thor Spark
    description:
      zh-CN: Thor Spark 平台（如 tc81），通过 V-Scheduler 授权运行 ONNX NER/OCR 模型。
      en: Thor Spark platform (e.g. tc81), runs ONNX NER/OCR models with V-Scheduler authorization.
    caps:
      device-type:
        - any-of: [thor-spark, thor]
      arch: arm64
      software: [cuda]
    conflicts: [amd, amd-without-cuda, arm, arm-without-cuda, l4t]

require-profiles: true

storage:
  directories:
    - path: data
      mode: "0755"
