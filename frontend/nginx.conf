server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /app/com.ictrek.desensitize {
        return 301 /app/com.ictrek.desensitize/;
    }

    location ^~ /app/com.ictrek.desensitize/ {
        rewrite ^/app/com\.ictrek\.desensitize/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://desensitize-backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
