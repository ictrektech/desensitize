x-desensitize-frontend-env: &desensitize-frontend-env
  API_BASE: /api/com.ictrek.desensitize
  APP_VERSION: "__APP_VERSION__"

x-desensitize-frontend-base: &desensitize-frontend-base
  restart: unless-stopped
  networks:
    vos_default:
      aliases:
        - desensitize-frontend
  environment: *desensitize-frontend-env
  labels:
    - "traefik.enable=true"
    - "traefik.docker.network=vos_default"
    - "traefik.http.routers.desensitize-top-open.rule=PathPrefix(`/app/com.ictrek.desensitize`) && HeadersRegexp(`Sec-Fetch-Dest`, `document`)"
    - "traefik.http.routers.desensitize-top-open.priority=1000"
    - "traefik.http.routers.desensitize-top-open.service=desensitize-web"
    - "traefik.http.routers.desensitize-top-open.middlewares=desensitize-top-open-redirect"
    - "traefik.http.middlewares.desensitize-top-open-redirect.redirectregex.regex=^(https?://[^/]+)/app/com\\.ictrek\\.desensitize/?(?:\\?.*)?$"
    - "traefik.http.middlewares.desensitize-top-open-redirect.redirectregex.replacement=$${1}/#/app/com.ictrek.desensitize/com-ictrek-desensitize/desensitize"
    - "traefik.http.middlewares.desensitize-top-open-redirect.redirectregex.permanent=false"
    - "traefik.http.routers.desensitize-web.rule=PathPrefix(`/app/com.ictrek.desensitize`)"
    - "traefik.http.routers.desensitize-web.service=desensitize-web"
    - "traefik.http.routers.desensitize-web.middlewares=desensitize-web-slash,desensitize-web-strip"
    - "traefik.http.middlewares.desensitize-web-slash.redirectregex.regex=^(.*)/app/com\\.ictrek\\.desensitize$"
    - "traefik.http.middlewares.desensitize-web-slash.redirectregex.replacement=$${1}/app/com.ictrek.desensitize/"
    - "traefik.http.middlewares.desensitize-web-slash.redirectregex.permanent=true"
    - "traefik.http.middlewares.desensitize-web-strip.stripprefix.prefixes=/app/com.ictrek.desensitize"
    - "traefik.http.services.desensitize-web.loadbalancer.server.port=80"

x-desensitize-backend-env: &desensitize-backend-env
  DESENSITIZE_DATA_DIR: /data
  DESENSITIZE_APP_VERSION: "__APP_VERSION__"
  # Model Hub owns the model lifecycle. This app only consumes its read-only export.
  DESENSITIZE_NER_ENABLED: ${DESENSITIZE_NER_ENABLED:-true}
  DESENSITIZE_NER_MODEL_DIR: /modelhub/export/ms/huluxiaohuowa/bert4ner-base-chinese-onnx/current
  MODEL_HUB_API_URL: ${MODEL_HUB_API_URL:-http://model-hub-backend:5005}
  DESENSITIZE_NER_PROVIDER: cpu
  DESENSITIZE_NER_MAX_CONCURRENCY: ${DESENSITIZE_NER_MAX_CONCURRENCY:-4}
  DESENSITIZE_NER_QUEUE_TIMEOUT_SECONDS: ${DESENSITIZE_NER_QUEUE_TIMEOUT_SECONDS:-30}
  DESENSITIZE_NER_INTRA_OP_THREADS: ${DESENSITIZE_NER_INTRA_OP_THREADS:-4}
  DESENSITIZE_IMAGE_OCR_ENABLED: ${DESENSITIZE_IMAGE_OCR_ENABLED:-true}
  DESENSITIZE_IMAGE_OCR_PROVIDER: cpu
  DESENSITIZE_IMAGE_OCR_MAX_CONCURRENCY: ${DESENSITIZE_IMAGE_OCR_MAX_CONCURRENCY:-1}
  DESENSITIZE_IMAGE_OCR_QUEUE_TIMEOUT_SECONDS: ${DESENSITIZE_IMAGE_OCR_QUEUE_TIMEOUT_SECONDS:-20}

x-desensitize-backend-base: &desensitize-backend-base
  restart: unless-stopped
  networks:
    vos_default:
      aliases:
        - desensitize-backend
  environment: *desensitize-backend-env
  volumes:
    - ${DESENSITIZE_DATA_PATH:-/data/vos_workspace/desensitize}:/data
    - ${MODEL_HUB_SHARED_MODELS_PATH:-/data/vos_workspace/model_hub}:/modelhub:ro
  labels:
    - "traefik.enable=true"
    - "traefik.docker.network=vos_default"
    - "traefik.http.routers.desensitize-api.rule=PathPrefix(`/api/com.ictrek.desensitize`)"
    - "traefik.http.routers.desensitize-api.service=desensitize-api"
    - "traefik.http.routers.desensitize-api.middlewares=desensitize-api-strip"
    - "traefik.http.middlewares.desensitize-api-strip.stripprefix.prefixes=/api/com.ictrek.desensitize"
    - "traefik.http.services.desensitize-api.loadbalancer.server.port=5000"
  healthcheck:
    test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).read()\" > /dev/null 2>&1 || exit 1"]
    interval: 30s
    timeout: 10s
    start_period: 10s
    retries: 3

# ── GPU backend base (for future PyTorch NER support) ──
x-desensitize-backend-gpu-base: &desensitize-backend-gpu-base
  <<: *desensitize-backend-base
  runtime: nvidia
  environment:
    <<: *desensitize-backend-env
    NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    DESENSITIZE_NER_PROVIDER: cuda
    DESENSITIZE_IMAGE_OCR_PROVIDER: cuda

services:
  # ── amd (AMD64 CUDA) ──
  desensitize-frontend-amd:
    <<: *desensitize-frontend-base
    profiles: ["amd"]
    image: ${DESENSITIZE_FRONTEND_AMD_IMAGE}
    environment:
      <<: *desensitize-frontend-env
      FRONTEND_IMAGE: ${DESENSITIZE_FRONTEND_AMD_IMAGE}
    pull_policy: always
    depends_on:
      desensitize-backend-amd:
        condition: service_healthy

  desensitize-backend-amd:
    <<: *desensitize-backend-gpu-base
    profiles: ["amd"]
    image: ${DESENSITIZE_BACKEND_AMD_IMAGE}
    environment:
      <<: *desensitize-backend-env
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      DESENSITIZE_NER_PROVIDER: cuda
      DESENSITIZE_IMAGE_OCR_PROVIDER: cuda
      DESENSITIZE_PROFILE: amd
      DESENSITIZE_BACKEND_IMAGE: ${DESENSITIZE_BACKEND_AMD_IMAGE}
      DESENSITIZE_FRONTEND_IMAGE: ${DESENSITIZE_FRONTEND_AMD_IMAGE}
    pull_policy: always

  # ── amd-without-cuda ──
  desensitize-frontend-amd-without-cuda:
    <<: *desensitize-frontend-base
    profiles: ["amd-without-cuda"]
    image: ${DESENSITIZE_FRONTEND_AMD_WITHOUT_CUDA_IMAGE}
    environment:
      <<: *desensitize-frontend-env
      FRONTEND_IMAGE: ${DESENSITIZE_FRONTEND_AMD_WITHOUT_CUDA_IMAGE}
    pull_policy: always
    depends_on:
      desensitize-backend-amd-without-cuda:
        condition: service_healthy

  desensitize-backend-amd-without-cuda:
    <<: *desensitize-backend-base
    profiles: ["amd-without-cuda"]
    image: ${DESENSITIZE_BACKEND_AMD_WITHOUT_CUDA_IMAGE}
    environment:
      <<: *desensitize-backend-env
      DESENSITIZE_PROFILE: amd-without-cuda
      DESENSITIZE_BACKEND_IMAGE: ${DESENSITIZE_BACKEND_AMD_WITHOUT_CUDA_IMAGE}
      DESENSITIZE_FRONTEND_IMAGE: ${DESENSITIZE_FRONTEND_AMD_WITHOUT_CUDA_IMAGE}
    pull_policy: always

  # ── arm (ARM CUDA) ──
  desensitize-frontend-arm:
    <<: *desensitize-frontend-base
    profiles: ["arm"]
    image: ${DESENSITIZE_FRONTEND_ARM_IMAGE}
    environment:
      <<: *desensitize-frontend-env
      FRONTEND_IMAGE: ${DESENSITIZE_FRONTEND_ARM_IMAGE}
    pull_policy: always
    depends_on:
      desensitize-backend-arm:
        condition: service_healthy

  desensitize-backend-arm:
    <<: *desensitize-backend-gpu-base
    profiles: ["arm"]
    image: ${DESENSITIZE_BACKEND_ARM_IMAGE}
    environment:
      <<: *desensitize-backend-env
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      DESENSITIZE_NER_PROVIDER: cuda
      DESENSITIZE_IMAGE_OCR_PROVIDER: cuda
      DESENSITIZE_PROFILE: arm
      DESENSITIZE_BACKEND_IMAGE: ${DESENSITIZE_BACKEND_ARM_IMAGE}
      DESENSITIZE_FRONTEND_IMAGE: ${DESENSITIZE_FRONTEND_ARM_IMAGE}
    pull_policy: always

  # ── arm-without-cuda ──
  desensitize-frontend-arm-without-cuda:
    <<: *desensitize-frontend-base
    profiles: ["arm-without-cuda"]
    image: ${DESENSITIZE_FRONTEND_ARM_WITHOUT_CUDA_IMAGE}
    environment:
      <<: *desensitize-frontend-env
      FRONTEND_IMAGE: ${DESENSITIZE_FRONTEND_ARM_WITHOUT_CUDA_IMAGE}
    pull_policy: always
    depends_on:
      desensitize-backend-arm-without-cuda:
        condition: service_healthy

  desensitize-backend-arm-without-cuda:
    <<: *desensitize-backend-base
    profiles: ["arm-without-cuda"]
    image: ${DESENSITIZE_BACKEND_ARM_WITHOUT_CUDA_IMAGE}
    environment:
      <<: *desensitize-backend-env
      DESENSITIZE_PROFILE: arm-without-cuda
      DESENSITIZE_BACKEND_IMAGE: ${DESENSITIZE_BACKEND_ARM_WITHOUT_CUDA_IMAGE}
      DESENSITIZE_FRONTEND_IMAGE: ${DESENSITIZE_FRONTEND_ARM_WITHOUT_CUDA_IMAGE}
    pull_policy: always

  # ── l4t (Jetson / L4T) ──
  desensitize-frontend-l4t:
    <<: *desensitize-frontend-base
    profiles: ["l4t"]
    image: ${DESENSITIZE_FRONTEND_L4T_IMAGE}
    environment:
      <<: *desensitize-frontend-env
      FRONTEND_IMAGE: ${DESENSITIZE_FRONTEND_L4T_IMAGE}
    pull_policy: always
    depends_on:
      desensitize-backend-l4t:
        condition: service_healthy

  desensitize-backend-l4t:
    <<: *desensitize-backend-gpu-base
    profiles: ["l4t"]
    image: ${DESENSITIZE_BACKEND_L4T_IMAGE}
    environment:
      <<: *desensitize-backend-env
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      DESENSITIZE_NER_PROVIDER: cuda
      DESENSITIZE_IMAGE_OCR_PROVIDER: cuda
      DESENSITIZE_PROFILE: l4t
      DESENSITIZE_BACKEND_IMAGE: ${DESENSITIZE_BACKEND_L4T_IMAGE}
      DESENSITIZE_FRONTEND_IMAGE: ${DESENSITIZE_FRONTEND_L4T_IMAGE}
    pull_policy: always

  # ── thor-spark ──
  desensitize-frontend-thor-spark:
    <<: *desensitize-frontend-base
    profiles: ["thor-spark"]
    image: ${DESENSITIZE_FRONTEND_THOR_SPARK_IMAGE}
    environment:
      <<: *desensitize-frontend-env
      FRONTEND_IMAGE: ${DESENSITIZE_FRONTEND_THOR_SPARK_IMAGE}
    pull_policy: always
    depends_on:
      desensitize-backend-thor-spark:
        condition: service_healthy

  desensitize-backend-thor-spark:
    <<: *desensitize-backend-gpu-base
    profiles: ["thor-spark"]
    image: ${DESENSITIZE_BACKEND_THOR_SPARK_IMAGE}
    environment:
      <<: *desensitize-backend-env
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      DESENSITIZE_NER_PROVIDER: cuda
      DESENSITIZE_IMAGE_OCR_PROVIDER: cuda
      DESENSITIZE_PROFILE: thor-spark
      DESENSITIZE_BACKEND_IMAGE: ${DESENSITIZE_BACKEND_THOR_SPARK_IMAGE}
      DESENSITIZE_FRONTEND_IMAGE: ${DESENSITIZE_FRONTEND_THOR_SPARK_IMAGE}
    pull_policy: always

networks:
  vos_default:
    external: true
