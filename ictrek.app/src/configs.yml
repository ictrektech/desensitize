configs:
  - name: DESENSITIZE_DATA_PATH
    type: path
    title:
      zh-CN: 数据目录
      en: Data Path
    description:
      zh-CN: 脱敏服务持久化数据目录（存储自定义规则等）。
      en: Persistent data directory for desensitize service (custom rules, etc.).
    default: /data/vos_workspace/desensitize

  - name: MODEL_HUB_SHARED_MODELS_PATH
    type: path
    title:
      zh-CN: Model Hub 共享模型目录
      en: Model Hub Shared Models Path
    description:
      zh-CN: Model Hub 的宿主机共享根目录。服务会以只读方式挂载整个目录，并从其中的 ModelScope 导出路径加载可选 NER 模型。
      en: Host shared-root directory managed by Model Hub. The service mounts it read-only and loads the optional NER model from its ModelScope export path.
    default: /data/vos_workspace/model_hub

  - name: DESENSITIZE_NER_ENABLED
    type: boolean
    title:
      zh-CN: 启用 NER 脱敏
      en: Enable NER Desensitization
    description:
      zh-CN: 启用后，可在 API 请求中传入 ner=true 识别人名和地址；未安装 Model Hub 模型时，纯规则 API 仍可正常使用。
      en: Enables person and location detection when requests set ner=true. Regex-only API calls remain available if the Model Hub model is absent.
    default: true

  - name: DESENSITIZE_NER_MAX_CONCURRENCY
    type: integer
    title:
      zh-CN: NER 最大并发数
      en: NER Maximum Concurrency
    description:
      zh-CN: 同时执行的 NER 推理数量。超出的请求会进入有界等待队列；GPU 默认建议使用 4。
      en: Number of simultaneous NER inferences. Excess requests wait in a bounded queue; 4 is the recommended GPU default.
    default: 4
    minimum: 1
    maximum: 16

  - name: DESENSITIZE_NER_QUEUE_TIMEOUT_SECONDS
    type: integer
    title:
      zh-CN: NER 队列等待秒数
      en: NER Queue Wait Timeout
    description:
      zh-CN: NER 并发已满时的最长等待时间；超过后请求返回“NER 队列繁忙，请稍后”。
      en: Maximum wait while NER concurrency is full. Requests return a busy response after this timeout.
    default: 30
    minimum: 0
    maximum: 300

  - name: DESENSITIZE_IMAGE_OCR_ENABLED
    type: boolean
    title:
      zh-CN: 启用图片 OCR 脱敏
      en: Enable Image OCR Desensitization
    description:
      zh-CN: 启用后可调用图片脱敏接口。接口会先 OCR，再重建文本并执行规则/可选 NER 脱敏。
      en: Enables the image desensitization API. The service runs OCR, reconstructs text, then applies regex and optional NER masking.
    default: true

  - name: DESENSITIZE_IMAGE_OCR_MAX_CONCURRENCY
    type: integer
    title:
      zh-CN: 图片 OCR 最大并发数
      en: Image OCR Maximum Concurrency
    description:
      zh-CN: 同时执行的图片 OCR 数量。tc192/L4T 等弱性能设备建议保持默认 1。
      en: Number of simultaneous image OCR jobs. Keep the default 1 on weaker tc192/L4T-class devices.
    default: 1
    minimum: 1
    maximum: 4

  - name: DESENSITIZE_IMAGE_OCR_QUEUE_TIMEOUT_SECONDS
    type: integer
    title:
      zh-CN: 图片 OCR 队列等待秒数
      en: Image OCR Queue Wait Timeout
    description:
      zh-CN: 图片 OCR 并发已满时的最长等待时间；超过后请求返回“图片 OCR 队列繁忙，请稍后”。
      en: Maximum wait while image OCR concurrency is full. Requests return a busy response after this timeout.
    default: 20
    minimum: 0
    maximum: 300
