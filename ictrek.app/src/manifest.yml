id: com.ictrek.desensitize
name:
  zh-CN: 数据脱敏服务
  en: Desensitize Service
description:
  zh-CN: 基于正则规则的敏感信息识别与脱敏 HTTP API，供 WeKnora、agent-room 等应用在调用云模型前统一脱敏。
  en: Regex-based sensitive information detection and desensitization HTTP API service.
version: __APP_VERSION__
author: ictrek
category: [ai]
arch: [amd64, arm64]

frontend:
  enabled: true
  basePath: /app/com.ictrek.desensitize

platform:
  version: ">=3.0.0"

profiles:
  - name: amd
    title:
      zh-CN: AMD64 CUDA
      en: AMD64 CUDA
    description:
      zh-CN: AMD64 平台，声明 nvidia runtime，未来可加载 PyTorch NER 模型。
      en: AMD64 platform with nvidia runtime, can load PyTorch NER models in the future.
    conflicts: [amd-without-cuda, arm, arm-without-cuda, l4t, thor-spark]
  - name: amd-without-cuda
    title:
      zh-CN: AMD64 无 CUDA
      en: AMD64 without CUDA
    description:
      zh-CN: AMD64 平台，不声明 nvidia runtime，适用于无显卡或未配置 NVIDIA runtime 的主机。
      en: AMD64 platform without nvidia runtime, for hosts without GPUs or NVIDIA runtime.
    conflicts: [amd, arm, arm-without-cuda, l4t, thor-spark]
  - name: arm
    title:
      zh-CN: ARM CUDA
      en: ARM CUDA
    description:
      zh-CN: ARM64 平台，声明 nvidia runtime，未来可加载 PyTorch NER 模型。
      en: ARM64 platform with nvidia runtime, can load PyTorch NER models in the future.
    conflicts: [amd, amd-without-cuda, arm-without-cuda, l4t, thor-spark]
  - name: arm-without-cuda
    title:
      zh-CN: ARM 无 CUDA
      en: ARM without CUDA
    description:
      zh-CN: ARM64 平台，不声明 nvidia runtime，适用于无显卡 ARM 主机。
      en: ARM64 platform without nvidia runtime, for ARM hosts without GPUs.
    conflicts: [amd, amd-without-cuda, arm, l4t, thor-spark]
  - name: l4t
    title:
      zh-CN: Jetson / L4T
      en: Jetson / L4T
    description:
      zh-CN: Jetson / L4T 平台（如 tc192），未来可加载 PyTorch NER 模型。
      en: Jetson / L4T platform (e.g. tc192), can load PyTorch NER models in the future.
    conflicts: [amd, amd-without-cuda, arm, arm-without-cuda, thor-spark]
  - name: thor-spark
    title:
      zh-CN: Thor Spark
      en: Thor Spark
    description:
      zh-CN: Thor Spark 平台（如 tc81），未来可加载 PyTorch NER 模型。
      en: Thor Spark platform (e.g. tc81), can load PyTorch NER models in the future.
    conflicts: [amd, amd-without-cuda, arm, arm-without-cuda, l4t]

storage:
  directories:
    - path: data
      mode: "0755"
