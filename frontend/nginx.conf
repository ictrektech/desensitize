server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /app/com.ictrek.desensitize {
        return 301 /app/com.ictrek.desensitize/;
    }

    location = /app/com.ictrek.desensitize/config.js {
        rewrite ^/app/com\.ictrek\.desensitize/(.*)$ /$1 break;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /config.js =404;
    }

    location = /app/com.ictrek.desensitize/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /index.html =404;
    }

    location ^~ /app/com.ictrek.desensitize/ {
        rewrite ^/app/com\.ictrek\.desensitize/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /config.js =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://desensitize-backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
